<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galmee Downloader</title>
</head>

<body style="background:#111;color:#fff;text-align:center;padding:40px;">

<h1>Galmee Downloader 🚀</h1>
<p>Download Facebook & Instagram videos in HD with sound</p>

<form id="dlForm">
    <input type="text" id="urlInput"
        placeholder="Paste video link here..."
        style="width:80%;padding:12px;border-radius:10px;border:none;">
    <br><br>
    <button type="submit"
        style="padding:12px 25px;background:#009959;color:#fff;border:none;border-radius:10px;">
        Download
    </button>
</form>

<div id="preview" style="margin-top:30px;"></div>

<script src="script.js"></script>

</body>
</html>
